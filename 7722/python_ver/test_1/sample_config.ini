; ITech 7722 驱动配置文件
; type: serial(本机默认，USB 虚拟串口) /
;       tcp(网口) / visa(直接给 VISA 资源名)。本机 USB 线使用 serial / COM6。
;
; 本机实测：COM6 = "USB 串行设备"，VID 0x2EC7(ITECH) / PID 0x7722，
; 也就是这台设备的 USB 走的是 CDC 虚拟串口，不是 USBTMC。
; 所以接真机请填 type = serial、port = COM6；界面已移除 USB-TMC 选项。
; 界面里点“扫描串口”会自动帮你选好串口与接口类型。
;
; 默认指令已按 IT-M7700 Programming Guide 修正，现场只读确认设备型号为 IT-M7722。
; -113 = 指令名不被识别；-350 = 错误队列溢出。启动前记录旧错误，每条设定后检查新错误。
; 定值模式：CV 电压设定，CI/CP 软件闭环调压；序列目前仅支持CV。

[Connection]
type = serial
port = COM6
baudrate = 9600
bytesize = 8
parity = N
stopbits = 1
timeout = 2.0
terminator = \r\n
host = 192.168.1.100
tcp_port = 9999
resource = TCPIP0::192.168.1.100::inst0::INSTR

[SCPI]
; {v} = 数值，{f} = 频率。可选指令留空表示不支持；删除键会恢复默认值。输出开关等必需指令不能留空。
idn = *IDN?
remote = SYST:REM
func_dc = SOUR:NORM:MODE DC
func_ac = SOUR:NORM:MODE AC
func_acdc = SOUR:NORM:MODE AC+DC
volt = 
volt_dc = SOUR:NORM:VOLT:DC {v}
volt_ac = SOUR:NORM:VOLT:AC {v}
curr = PROT:MAX:CURR:LIM {v}
power = 
freq = SOUR:NORM:FREQ {f}
out_on = OUTP:STAT ON
out_off = OUTP:STAT OFF
ovp = PROT:RMS:VOLT {v}
ocp = PROT:RMS:CURR {v}
opp = PROT:POW {v}
meas_volt = 
meas_volt_dc = MEAS:VOLT:DC?
meas_volt_ac = MEAS:VOLT:AC?
meas_curr = 
meas_curr_dc = MEAS:CURR:DC?
meas_curr_ac = MEAS:CURR:AC?
meas_power = MEAS:POW?
meas_power_factor = MEAS:POW:PFAC?
meas_freq = MEAS:FREQ?

[Limits]
; IT-M7722 电流按手册默认 OCP=6A，频率50Hz；输出电压按用户要求改为5V
; 保护上限：300V / 6A / 600W。注意保护电压上限不是默认输出电压。
max_voltage = 300
max_current = 6
max_power = 600

[Setting]
; mode: dc / ac / acdc ；control: CV(电压设定) / CI(电流闭环) / CP(功率闭环)
; output_mode: hold(定值模式) / seq(序列模式)
mode = ac
control = CV
value = 5
frequency = 50
output_mode = hold

[Sequence]
file = sequence_demo.csv
loop = false

[Recording]
enabled = true
interval_ms = 1000
; 固定记录四项，params仅用于兼容旧配置
params = voltage,current,power,power_factor
log_file = data_log.csv
keypoint_file = keypoint_log.csv

[Keypoints]
; 键 = 关键电压(V)，值固定为电压、电流、功率、功率因子；设定电压相等时记录
110 = voltage,current,power,power_factor
220 = voltage,current,power,power_factor

[Feedback]
; CI/CP从0V开始，仅通过调节电压跟踪电流/有功功率目标。
; 单独设置闭环电压上限，默认5V；不会自动尝试到300V保护上限。
max_voltage = 5
step_voltage = 0.2
interval_ms = 200
tolerance_rel = 0.01
timeout_s = 60
settle_timeout_s = 3
; 低压回读绝对偏差容差，不改变电压/电流/功率保护上限
readback_tolerance_v = 1
