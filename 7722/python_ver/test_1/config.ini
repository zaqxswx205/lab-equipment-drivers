; ITech 7722 驱动配置文件
; type: serial(RS232或USB虚拟串口,设备显示为COM口) /
;       tcp(网口) / visa(直接给VISA资源名)；本机 USB 线通过 serial/COM6 通信
; [SCPI] 段的值是实际下发指令，{v}=数值 {f}=频率。不同系列助记符可能不同，
; 请按随机 Programming Guide 校正；界面右下角 SCPI 调试台可逐条验证后再写回本文件。
; [Keypoints] 键=关键电压(V)，命中后统一记录电压、电流、功率、功率因子；按下发设定电压相等触发。
[Connection]
type = serial
port = COM4
baudrate = 9600
timeout = 2.0
bytesize = 8
parity = N
stopbits = 1
terminator = \r\n
host = 192.168.1.100
tcp_port = 9999
resource = TCPIP0::192.168.1.100::inst0::INSTR

[SCPI]
idn = *IDN?
remote = SYST:REM
func_dc = SOUR:NORM:MODE DC
func_ac = SOUR:NORM:MODE AC
func_acdc = SOUR:NORM:MODE AC+DC
volt = 
volt_dc = SOUR:NORM:VOLT:DC {v}
volt_ac = SOUR:NORM:VOLT:AC {v}
curr = PROT:MAX:CURR:LIM {v}
power = 
freq = SOUR:NORM:FREQ {f}
out_on = OUTP:STAT ON
out_off = OUTP:STAT OFF
ovp = PROT:RMS:VOLT {v}
ocp = PROT:RMS:CURR {v}
opp = PROT:POW {v}
meas_volt = 
meas_volt_dc = MEAS:VOLT:DC?
meas_volt_ac = MEAS:VOLT:AC?
meas_curr = 
meas_curr_dc = MEAS:CURR:DC?
meas_curr_ac = MEAS:CURR:AC?
meas_power = MEAS:POW?
meas_freq = MEAS:FREQ?
meas_power_factor = MEAS:POW:PFAC?
err_next = SYST:ERR?

[Limits]
max_voltage = 300
max_current = 6
max_power = 600

[Setting]
mode = AC
control = CV
value = 5.0
frequency = 50.0
output_mode = hold

[Feedback]
max_voltage = 20.0
step_voltage = 0.2
interval_ms = 200.0
tolerance_rel = 0.01
timeout_s = 60.0
settle_timeout_s = 3.0
readback_tolerance_v = 1.0

[Sequence]
file = c:\Project\实验设备驱动\7722\test_1\sequence_demo.csv
loop = false

[Recording]
enabled = true
interval_ms = 1000
params = voltage,current,power,power_factor
log_file = c:\Project\实验设备驱动\7722\test_1\data_log.csv
keypoint_file = c:\Project\实验设备驱动\7722\test_1\keypoint_log.csv

[Keypoints]
1 = voltage,current,power,power_factor
2 = voltage,current,power,power_factor

