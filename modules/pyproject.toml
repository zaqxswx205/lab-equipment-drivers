[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-equipment-drivers"
version = "0.1.0"
description = "Standalone ITECH 7722 and Keithley 2700/7700/7702 drivers"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
visa = ["pyvisa>=1.12", "pyvisa-py>=0.7"]

[tool.setuptools]
py-modules = ["itech7722", "keithley2700"]
